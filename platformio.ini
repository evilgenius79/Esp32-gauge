; PlatformIO Configuration for ESP32 OBD2 Gauge
; CrowPanel 1.28" HMI ESP32-S3 Rotary Display + CJMCU-1051 CAN Bus

[env:crowpanel_128]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 specific settings matching CrowPanel 1.28"
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram = opi

; Partition scheme: Huge APP (3MB No OTA/1MB SPIFFS)
board_build.partitions = huge_app.csv

; Libraries
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    https://github.com/handmade0octopus/ESP32-TWAI-CAN.git

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

monitor_speed = 115200
upload_speed = 921600
