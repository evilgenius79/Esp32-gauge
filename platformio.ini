; PlatformIO Configuration for ESP32 OBD2 Gauge
; Supports: CrowPanel 1.28" (single gauge) + M5Stack Tab5 (4-gauge dashboard)

; =============================================================================
; CrowPanel 1.28" HMI ESP32-S3 Rotary Display
; =============================================================================
[env:crowpanel_128]
platform = espressif32@6.5.0
platform_packages =
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram = opi
board_build.partitions = huge_app.csv

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    https://github.com/handmade0octopus/ESP32-TWAI-CAN.git

build_flags =
    -DTARGET_CROWPANEL
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

monitor_speed = 115200
upload_speed = 921600

; =============================================================================
; M5Stack Tab5 (ESP32-P4) — 4-gauge dashboard on 1280x720
; =============================================================================
[env:m5stack_tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
platform_packages =
    platformio/toolchain-riscv32-esp@14.2.0+20241119
board = esp32-p4-evboard
framework = arduino

board_build.mcu = esp32p4
board_build.f_cpu = 400000000L
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram = opi
board_build.partitions = huge_app.csv

lib_deps =
    https://github.com/m5stack/M5Unified.git
    https://github.com/m5stack/M5GFX.git
    https://github.com/handmade0octopus/ESP32-TWAI-CAN.git

build_flags =
    -DTARGET_TAB5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

; Exclude encoder (CrowPanel-only) from Tab5 build
build_src_filter = +<*> -<encoder.cpp>

monitor_speed = 115200
upload_speed = 921600
